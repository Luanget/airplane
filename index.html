<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://api.openai.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Airplane" />
  <meta name="format-detection" content="telephone=no" />
  <title>Airplane</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./shared.css">
</head>
<body>
  <div data-shell class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand-row"><span class="brand-mark" data-shell-icon="plane"></span><h1>Airplane</h1></div>
        <div class="month-switcher day-picker">
          <button type="button" data-day-step="-1" class="month-step month-step-prev" data-shell-icon="chevron" aria-label="前一天"></button>
          <label class="day-picker-value"><span class="sr-only">查看日期</span><input id="finance-date" type="date" data-short-date></label>
          <button type="button" data-day-step="1" class="month-step" data-shell-icon="chevron" aria-label="后一天"></button>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="icon-button" data-module-link data-shell-icon="health" href="./health/" aria-label="健康" title="健康"></a>
        <button class="icon-button" id="settingsButton" aria-label="打开设置" data-shell-icon="settings"></button>
      </div>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav class="tabbar tabbar-with-ai" aria-label="主导航">
      <div class="tab-group"><button data-tab="home" class="tab active"><span data-shell-icon="home"></span><small>首页</small></button></div>
      <button id="addButton" class="add-button" aria-label="记一笔" data-shell-icon="plus"></button>
      <div class="tab-group"><button data-tab="stats" class="tab"><span data-shell-icon="chart"></span><small>统计</small></button>
      <a href="./assistant/" data-open-ai class="tab ai-tab" aria-label="AI 助手"><span data-shell-icon="sparkles"></span><small>AI</small></a></div>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <input id="importInput" type="file" accept="application/json,.json" hidden />
  <script type="module" src="./boot.mjs"></script>
</body>
</html>
